services:
  postgres:
    image: postgres:16
    container_name: pricewatch-postgres
    restart: always
    environment:
      POSTGRES_DB: pricewatch
      POSTGRES_USER: pricewatch_user
      POSTGRES_PASSWORD: pricewatch_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pricewatch-redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data: